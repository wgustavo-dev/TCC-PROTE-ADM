    </aside>

    <main class="main">

      <div class="cabecalho-pagina">
        <h1 class="page-title titulo-presenca">Presença</h1>
        <p class="page-sub">Registre a presença diária dos alunos</p>
      </div>

      <section class="card barra-data">
        <div>
          <label class="label-data" for="campoData">Data de registro</label>
          <input type="date" id="campoData" class="input-data" />
        </div>

        <div class="acoes-topo">
          <button class="botao-verde" id="botaoMarcarTodos">Marcar todos</button>
          <button class="botao-vermelho" id="botaoDesmarcarTodos">Desmarcar todos</button>
        </div>
      </section>

      <section class="cards-presenca">
        <div class="card card-indicador-presenca">
          <div class="linha-card">
            <span class="quadrado verde">✓</span>
            <span>Presentes</span>
          </div>
          <strong id="totalPresentes">0</strong>
          <small>de alunos</small>
        </div>

        <div class="card card-indicador-presenca">
          <div class="linha-card">
            <span class="quadrado vermelho">!</span>>
            <span>Ausentes</span>
          </div>
          <strong id="totalAusentes">0</strong>
          <small>de alunos</small>
        </div>

        <div class="card card-indicador-presenca">
          <div class="linha-card">
            <span class="quadrado azul">%</span>
            <span>Taxa de presença</span>
          </div>
          <strong id="taxaPresenca">0%</strong>
          <div class="barra-taxa">
            <div id="barraTaxaPreenchimento"></div>
          </div>
        </div>
      </section>

      <section class="card lista-chamada">
        <h2>Lista de chamada</h2>
        <p class="sub-lista" id="textoDataLista">Selecione uma data para registrar a presença</p>

        <div id="listaAlunosPresenca"></div>

        <button class="botao-salvar" id="botaoSalvarChamada">
          Salvar registro da chamada
        </button>
      </section>

    </main>
  </div>

  <script src="core/api.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="js/presenca.js"></script>
