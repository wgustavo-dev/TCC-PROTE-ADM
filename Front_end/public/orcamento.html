<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PROTE — Orçamentos</title>

  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/orcamento.css" />
</head>
<body>

  <div class="fundo-escuro" id="fundoEscuro"></div>

  <div class="layout">
    <!-- Barra do topo no celular -->
    <header class="barra-topo">
      <button class="botao-menu" id="botaoMenu" aria-label="Abrir menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <span class="nome-sistema-topo">PROTE</span>
    </header>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="logo">
        <div class="logo-title">PROTE</div>
        <div class="logo-sub">Painel Administrativo</div>
      </div>

      <nav class="nav">
        <a href="index.html" class="nav-item" data-page="dashboard">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"/>
            <rect x="14" y="3" width="7" height="7"/>
            <rect x="3" y="14" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/>
          </svg>
          Dashboard
        </a>

        <a href="despesas.html" class="nav-item" data-page="despesas">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="1" x2="12" y2="23"/>
            <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
          </svg>
          Despesas
        </a>

        <a href="documentos.html" class="nav-item" data-page="vistorias">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 11 12 14 22 4"/>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
          </svg>
          Vistoria
        </a>

        <a href="alunos.html" class="nav-item" data-page="alunos">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          Alunos
        </a>

        <a href="orcamento.html" class="nav-item active" data-page="orcamentos">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
          </svg>
          Orçamento
        </a>

        <a href="mensalidade.html" class="nav-item" data-page="mensalidades">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="1" y="4" width="22" height="16" rx="2" ry="2"/>
            <line x1="1" y1="10" x2="23" y2="10"/>
          </svg>
          Mensalidades
        </a>

        <a href="presenca.html" class="nav-item" data-page="presenca">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 11 12 14 22 4"/>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
          </svg>
          Presença
        </a>
      </nav>
    </aside>

    <!-- Conteúdo -->
    <main class="main">

      <div class="cabecalho-pagina cabecalho-orcamento">
        <div>
          <h1 class="page-title titulo-orcamento">Gestão de orçamentos</h1>
          <p class="page-sub">Gerencie pagamentos e comunicação com clientes</p>
        </div>

<button class="botao-primario-orcamento" id="botaoNovoOrcamento">
  <svg class="icone-botao-topo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
    <line x1="12" y1="5" x2="12" y2="19"></line>
    <line x1="5" y1="12" x2="19" y2="12"></line>
  </svg>
  Novo orçamento
</button>
      </div>

      <div class="card barra-status">
        <button class="aba-status active" data-status="pendente">PENDENTES</button>
        <button class="aba-status" data-status="aprovado">APROVADOS</button>
        <button class="aba-status" data-status="reprovado">REPROVADOS</button>
      </div>

      <div class="card caixa-busca-orcamento">
        <div class="campo-busca-com-icone">
          <svg class="icone-busca" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>

          <input
            type="text"
            id="campoBusca"
            class="input-busca-orcamento"
            placeholder="Buscar por Responsável..."
          />
        </div>
      </div>

      <div class="card tabela-orcamentos-card">
        <div class="tabela-responsiva">
          <table class="tabela-orcamentos" id="tabelaOrcamentos">
            <thead>
              <tr>
                <th>RESPONSÁVEL</th>
                <th>TRAJETO</th>
                <th>ENDEREÇO EMBARQUE</th>
                <th>ENDEREÇO DESEMBARQUE</th>
                <th>STATUS</th>
                <th>AÇÕES</th>
              </tr>
            </thead>
            <tbody id="linhasOrcamentos"></tbody>
          </table>
        </div>

        <div class="aviso-vazio" id="avisoVazio">
          Nenhum orçamento cadastrado ainda.
        </div>
      </div>
    </main>
  </div>

  <!-- Modal -->
  <div class="fundo-modal" id="fundoModal">
    <div class="caixa-modal" role="dialog" aria-modal="true" aria-labelledby="tituloModal">
      <h2 class="titulo-modal" id="tituloModal">Novo orçamento</h2>

      <input type="hidden" id="campoId" />

      <div class="grupo-campo">
        <label class="label-campo" for="campoResponsavel">Nome do Responsável</label>
        <input type="text" class="input-campo" id="campoResponsavel" placeholder="Digite..." />
        <span class="mensagem-erro" id="erroResponsavel"></span>
      </div>

      <div class="grupo-campo">
        <label class="label-campo" for="campoTrajeto">Trajeto</label>
        <select class="select-campo" id="campoTrajeto">
          <option value="">Selecione...</option>
          <option value="Ida">Ida</option>
          <option value="Volta">Volta</option>
          <option value="Ambos">Ambos</option>
        </select>
        <span class="mensagem-erro" id="erroTrajeto"></span>
      </div>

      <div class="grupo-campo">
        <label class="label-campo" for="campoEmbarque">Endereço embarque</label>
        <input type="text" class="input-campo" id="campoEmbarque" placeholder="Digite o endereço..." />
        <span class="mensagem-erro" id="erroEmbarque"></span>
      </div>

      <div class="grupo-campo">
        <label class="label-campo" for="campoDesembarque">Endereço desembarque</label>
        <input type="text" class="input-campo" id="campoDesembarque" placeholder="Digite o endereço..." />
        <span class="mensagem-erro" id="erroDesembarque"></span>
      </div>

      <div class="acoes-modal">
        <button class="botao-cancelar" id="botaoCancelar">Cancelar</button>
        <button class="botao-cadastrar" id="botaoSalvar">Cadastrar</button>
      </div>
    </div>
  </div>

<script src="js/orcamento.js"></script>
</body>
</html>
