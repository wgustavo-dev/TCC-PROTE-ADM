        <span></span>

    <aside class="sidebar" id="sidebar">
      <div class="logo">
        <div class="logo-title">PROTE</div>

      <nav class="nav">
        <a href="index.html" class="nav-item" data-page="dashboard">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="3" width="7" height="7" rx="1.5"></rect><rect x="14" y="14" width="7" height="7" rx="1.5"></rect><rect x="3" y="14" width="7" height="7" rx="1.5"></rect></svg>
          Dashboard
        </a>
        <a href="despesas.html" class="nav-item" data-page="despesas">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="2" x2="12" y2="22"></line><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"></path></svg>
          Despesas

        <a href="documentos.html" class="nav-item" data-page="documentos">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6"></path><path d="M8 13h8"></path><path d="M8 17h5"></path></svg>
          Documentos
        </a>
        <a href="responsaveis.html" class="nav-item" data-page="responsaveis">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
          Responsáveis
        </a>
        <a href="alunos.html" class="nav-item" data-page="alunos">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
          Alunos
        </a>
        <a href="orcamento.html" class="nav-item" data-page="orcamento">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6"></path><path d="M12 18v-6"></path><path d="M9 15h6"></path></svg>

          Acessos
        </a>
      </nav>
    </aside>

    <main class="main acessos-main">
      <div class="cabecalho-pagina acessos-cabecalho">
        <div>
          <h1 class="page-title">Controle de acessos</h1>
          <p class="page-sub">Controle os acessos</p>
        </div>

        <button class="btn-primary btn-novo-acesso" id="btnNovoAcesso" type="button">
          <span>+</span>
          Novo acesso
        </button>
      </div>

      <section class="acessos-toolbar" aria-label="Busca e filtro de acessos">
        <div class="campo-busca-acessos">
          <svg class="icone-busca" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>

          <input
            id="inputBuscaAcesso"
            class="input-busca-acessos"
            type="text"
            aria-label="Buscar acesso"
          />
        </div>

        <select id="filtroAcesso" class="select-filtro-acessos" aria-label="Filtrar por tipo de acesso">
          <option value="todos">Filtrar por...</option>
          <option value="Condutor">Condutor</option>
          <option value="Monitor">Monitor</option>
        </select>
      </section>

      <div class="card card-acessos">
        <div class="table-wrapper-acessos">
          <table class="tabela-acessos">
            <thead>
              <tr>
                <th>ID</th>
                <th>NOME</th>
                <th>ACESSO</th>
                <th>OUTROS DADOS</th>
                <th>AÇÕES</th>
              </tr>
            </thead>

            <tbody id="tbodyAcessos"></tbody>
          </table>
        </div>

        <div class="empty-state hidden" id="emptyStateAcessos">
          Nenhum acesso encontrado.
        </div>
      </div>
    </main>
  </div>

  <div class="modal-overlay hidden" id="modalAcessoOverlay">
    <div class="modal-card-acesso" role="dialog" aria-modal="true" aria-labelledby="modalTituloAcesso">
      <div class="modal-header-acesso">
        <h2 id="modalTituloAcesso">Novo acesso</h2>
      </div>

      <form id="formAcesso" class="form-acesso">
        <input type="hidden" id="acessoId" />

        <div class="grupo-form-acesso">
          <label for="nomeAcesso">Nome</label>
          <input type="text" id="nomeAcesso" placeholder="Digite..." required />
        </div>

        <div class="grupo-form-acesso">
          <label for="tipoAcesso">Acesso</label>
          <select id="tipoAcesso" required>
            <option value="" selected disabled>Selecione...</option>
            <option value="Condutor">Condutor</option>
            <option value="Monitor">Monitor</option>

          </select>
        </div>


        <div class="grupo-form-acesso">
          <label for="emailAcesso">Email</label>
          <input type="email" id="emailAcesso" placeholder="Digite..." required />
        </div>

        <div class="grupo-form-acesso">
          <label for="telefoneAcesso">Telefone</label>
          <input type="text" id="telefoneAcesso" placeholder="(xx) xxxxx-xxxx" required />
        </div>

<div class="grupo-form-acesso">
  <label for="senhaAcesso">Senha</label>
  <input
    type="password"
    id="senhaAcesso"
    placeholder="Digite a senha"
    required
  />
</div>

<div class="grupo-form-acesso">
  <label for="confirmarSenhaAcesso">Confirmar senha</label>
  <input
    type="password"
    id="confirmarSenhaAcesso"
    placeholder="Confirme a senha"
    required
  />
</div>

        <div class="modal-actions-acesso">
          <button type="button" class="btn-secondary-acesso" id="btnCancelarAcesso">Cancelar</button>
          <button type="submit" class="btn-primary-acesso" id="btnSalvarAcesso">Cadastrar</button>
        </div>
      </form>
    </div>
  </div>

  <script src="core/api.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script type="module" src="js/acessos.js"></script>
</body>
</html>
